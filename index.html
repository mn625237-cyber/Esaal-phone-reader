<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>رقم — قراءة أرقام الريسيتات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1E1C18;
    --bg-2: #28251F;
    --bg-3: #322E26;
    --paper: #FBF8F1;
    --paper-2: #F1ECDF;
    --ink: #2A2620;
    --ink-soft: #7A7267;
    --stamp: #C23B22;
    --stamp-dark: #9C2E19;
    --highlighter: #F6C445;
    --text-hi: #F3EEE1;
    --text-soft: #B7AF9F;
    --line: #45403635;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(ellipse at top, var(--bg-3), var(--bg) 70%);
    color: var(--text-hi);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .app{ max-width: 480px; margin: 0 auto; }

  /* ---------- header ---------- */
  .app-header{ text-align:center; margin-bottom: 22px; }
  .stamp-logo{
    display:inline-block;
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size: 30px;
    color: var(--stamp);
    border: 3px solid var(--stamp);
    border-radius: 10px;
    padding: 4px 22px;
    transform: rotate(-3deg);
    letter-spacing: 1px;
  }
  .tagline{
    margin: 12px 0 0;
    font-size: 14px;
    color: var(--text-soft);
    font-weight: 600;
  }

  /* ---------- receipt-paper card shell ---------- */
  .receipt{
    position: relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px 4px 0 0;
    padding: 20px 18px 26px;
    box-shadow: 0 14px 28px rgba(0,0,0,.35);
    margin-bottom: 26px;
  }
  .receipt::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-11px; height:12px;
    background:
      linear-gradient(-45deg, var(--bg) 6px, transparent 0) 0 0,
      linear-gradient(45deg, var(--bg) 6px, transparent 0) 0 0;
    background-size: 12px 12px;
    background-repeat: repeat-x;
  }

  /* ---------- capture ---------- */
  .capture-card{ text-align:center; }
  #fileInputCamera, #fileInputGallery{ display:none; }
  .capture-choices{ display:flex; gap:10px; }
  .capture-choices .btn-primary{ flex:1; padding:16px 6px; font-size:15px; }
  .btn-alt{ background: var(--bg-3) !important; color: var(--text-hi) !important; border: 2px solid var(--stamp); }
  .btn-alt:active{ background: var(--bg-2) !important; }
  .btn-primary{
    width:100%;
    background: var(--stamp);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 16px 12px;
    font-family:'Cairo', sans-serif;
    font-weight: 800;
    font-size: 17px;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-primary:active{ background: var(--stamp-dark); transform: scale(.98); }
  .preview-wrap{
    margin-top: 16px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line);
    max-height: 200px;
  }
  .preview-wrap img{ display:block; width:100%; object-fit: cover; max-height: 200px; }
  .status{
    margin-top: 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .status.error{ color: var(--stamp); }
  .spinner{
    display:inline-block; width:14px; height:14px; margin-left:8px;
    border: 2px solid var(--ink-soft);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: -2px;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- result ---------- */
  .result-label{ margin: 0 0 10px; font-weight: 700; font-size: 14px; color: var(--ink-soft); }
  .phone-input{
    width:100%;
    direction: ltr;
    text-align: center;
    font-family:'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 2px;
    color: var(--ink);
    border: none;
    border-bottom: 2px dashed #C9C1AE;
    background-image: linear-gradient(var(--highlighter), var(--highlighter));
    background-repeat: no-repeat;
    background-size: 0% 55%;
    background-position: center 65%;
    transition: background-size .7s ease;
    padding: 10px 6px;
    outline: none;
  }
  .phone-input.revealed{ background-size: 100% 55%; }
  .phone-input:focus{ border-bottom-color: var(--stamp); }
  .hint{ margin: 10px 2px 0; font-size: 12.5px; color: var(--ink-soft); text-align:center; }
  .alt-wrap{ margin-top: 12px; }
  .alt-label{ display:block; font-size: 12px; color: var(--ink-soft); font-weight:700; margin-bottom:6px; }
  .alt-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    font-family:'JetBrains Mono', monospace; direction: ltr;
    background: var(--paper-2); border: 1px solid #D8D1BE; color: var(--ink);
    border-radius: 20px; padding: 5px 12px; font-size: 12.5px; cursor:pointer;
  }
  .result-actions{ display:flex; gap:10px; margin-top: 16px; }
  .btn-ghost{
    flex: 0 0 auto;
    background: transparent;
    border: 2px solid #D8D1BE;
    color: var(--ink-soft);
    border-radius: 10px;
    padding: 0 18px;
    font-family:'Cairo', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  .result-actions .btn-primary{ flex: 1; }

  @media (prefers-reduced-motion: reduce){
    .phone-input{ transition: none; }
    .spinner{ animation: none; border-top-color: var(--ink-soft); }
  }

  /* ---------- log ---------- */
  .log-section{ margin-top: 8px; }
  .log-header h2{
    font-size: 16px; font-weight: 800; margin: 0 0 12px;
    color: var(--text-hi);
  }
  .log-header h2 span{ color: var(--highlighter); }
  .export-bar{ display:flex; gap:8px; margin-bottom: 14px; flex-wrap: wrap; }
  .btn-small{
    background: var(--bg-3);
    border: 1px solid #4A4437;
    color: var(--text-hi);
    border-radius: 8px;
    padding: 9px 12px;
    font-family:'Cairo', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-small.btn-danger{ color: #E8998A; border-color: #6B392E; margin-right: auto; }
  .log-list{ list-style:none; margin:0; padding:0; }
  .log-row{
    display:flex; align-items:center; gap:10px;
    padding: 12px 4px;
    border-top: 1px dashed #4A4437;
  }
  .log-row:first-child{ border-top: none; }
  .log-phone{
    font-family:'JetBrains Mono', monospace;
    direction: ltr; text-align: left;
    font-weight: 700; font-size: 17px; color: var(--text-hi);
    flex: 1;
  }
  .log-time{
    display:block; margin-top:2px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text-soft); font-weight: 500;
  }
  .log-actions{ display:flex; gap:6px; }
  .icon-btn{
    background: var(--bg-3);
    border: 1px solid #4A4437;
    color: var(--text-hi);
    width: 36px; height:36px;
    border-radius: 8px;
    font-size: 15px;
    display:flex; align-items:center; justify-content:center;
    cursor: pointer; text-decoration:none;
  }
  .icon-btn.danger{ color:#E8998A; }
  .empty-state{
    text-align:center; color: var(--text-soft);
    font-size: 13.5px; padding: 18px 10px; font-weight: 600;
  }

  /* ---------- toast ---------- */
  .toast{
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--paper); color: var(--ink);
    font-weight: 700; font-size: 14px;
    padding: 10px 20px; border-radius: 30px;
    box-shadow: 0 10px 24px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="stamp-logo">رقم</div>
    <p class="tagline">صوّر الريسيت، ياخدلك رقم العميل في ثانية</p>
  </header>

  <main>
    <section class="receipt capture-card" id="captureCard">
      <input type="file" id="fileInputCamera" accept="image/*" capture="environment">
      <input type="file" id="fileInputGallery" accept="image/*">
      <div class="capture-choices">
        <button class="btn-primary" id="cameraBtn">📷 صوّر دلوقتي</button>
        <button class="btn-primary btn-alt" id="galleryBtn">🖼 اختار من المعرض</button>
      </div>
      <div class="preview-wrap" id="previewWrap" hidden>
        <img id="previewImg" alt="صورة الريسيت">
      </div>
      <div class="status" id="statusText" hidden></div>
    </section>

    <section class="receipt result-card" id="resultCard" hidden>
      <p class="result-label">الرقم اللي اتقرا من الريسيت:</p>
      <input type="tel" id="phoneInput" class="phone-input" inputmode="numeric" maxlength="14" placeholder="01xxxxxxxxx">
      <p class="hint" id="resultHint">لو الرقم غلط أو ناقص، عدّله يدويًا قبل الحفظ</p>
      <div class="alt-wrap" id="altWrap" hidden>
        <span class="alt-label">أرقام تانية اتلاقت في نفس الصورة:</span>
        <div class="alt-chips" id="altChips"></div>
      </div>
      <div class="result-actions">
        <button class="btn-primary" id="saveBtn">💾 حفظ الرقم</button>
        <button class="btn-ghost" id="discardBtn">إلغاء</button>
      </div>
    </section>

    <section class="log-section">
      <div class="log-header">
        <h2>الأرقام المحفوظة (<span id="logCount">0</span>)</h2>
      </div>
      <div class="export-bar" id="exportBar" hidden>
        <button class="btn-small" id="copyAllBtn">📋 نسخ الكل</button>
        <button class="btn-small" id="csvBtn">⬇️ تنزيل CSV</button>
        <button class="btn-small btn-danger" id="clearBtn">🗑 مسح الكل</button>
      </div>
      <ul class="log-list" id="logList"></ul>
      <p class="empty-state" id="emptyState">لسه مفيش أرقام محفوظة — صوّر أول ريسيت وابدأ</p>
    </section>
  </main>

  <div class="toast" id="toast"></div>
</div>

<script>
const STORAGE_KEY = 'phone-log';

const els = {
  fileInputCamera: document.getElementById('fileInputCamera'),
  fileInputGallery: document.getElementById('fileInputGallery'),
  cameraBtn: document.getElementById('cameraBtn'),
  galleryBtn: document.getElementById('galleryBtn'),
  previewWrap: document.getElementById('previewWrap'),
  previewImg: document.getElementById('previewImg'),
  statusText: document.getElementById('statusText'),
  resultCard: document.getElementById('resultCard'),
  phoneInput: document.getElementById('phoneInput'),
  resultHint: document.getElementById('resultHint'),
  altWrap: document.getElementById('altWrap'),
  altChips: document.getElementById('altChips'),
  saveBtn: document.getElementById('saveBtn'),
  discardBtn: document.getElementById('discardBtn'),
  logCount: document.getElementById('logCount'),
  exportBar: document.getElementById('exportBar'),
  logList: document.getElementById('logList'),
  emptyState: document.getElementById('emptyState'),
  copyAllBtn: document.getElementById('copyAllBtn'),
  csvBtn: document.getElementById('csvBtn'),
  clearBtn: document.getElementById('clearBtn'),
  toast: document.getElementById('toast'),
};

let log = [];

// ---------- storage (plain browser localStorage — works on any real website) ----------
async function loadLog(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){
    return [];
  }
}
async function saveLog(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
  }catch(e){
    showToast('تعذّر الحفظ — جرّب تاني');
  }
}

// ---------- toast ----------
let toastTimer;
function showToast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> els.toast.classList.remove('show'), 1800);
}

// ---------- render log ----------
function formatTime(iso){
  try{
    return new Intl.DateTimeFormat('ar-EG', { dateStyle:'short', timeStyle:'short' }).format(new Date(iso));
  }catch(e){ return ''; }
}
function renderLog(){
  els.logCount.textContent = log.length;
  els.exportBar.hidden = log.length === 0;
  els.emptyState.hidden = log.length !== 0;
  els.logList.innerHTML = '';
  log.forEach((entry, i) => {
    const li = document.createElement('li');
    li.className = 'log-row';
    li.innerHTML = `
      <div class="log-phone">${entry.phone}<span class="log-time">${formatTime(entry.savedAt)}</span></div>
      <div class="log-actions">
        <a class="icon-btn" href="tel:${entry.phone}" title="اتصال">📞</a>
        <button class="icon-btn" data-copy="${i}" title="نسخ">📋</button>
        <button class="icon-btn danger" data-del="${i}" title="حذف">✕</button>
      </div>`;
    els.logList.appendChild(li);
  });
}

els.logList.addEventListener('click', async (e) => {
  const copyIdx = e.target.closest('[data-copy]');
  const delIdx = e.target.closest('[data-del]');
  if (copyIdx){
    const entry = log[Number(copyIdx.dataset.copy)];
    await navigator.clipboard.writeText(entry.phone);
    showToast('اتنسخ ✅');
  }
  if (delIdx){
    if (!confirm('تمسح الرقم ده؟')) return;
    log.splice(Number(delIdx.dataset.del), 1);
    await saveLog();
    renderLog();
    showToast('اتمسح');
  }
});

// ---------- image resize (keeps upload small/fast on mobile data) ----------
function resizeImageToBase64(file, maxDim = 1600, quality = 0.85){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('image load failed'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          if (width > height){ height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------- OCR (Gemini Flash, called through our own /api route so the key stays hidden) ----------
async function extractPhone(base64Image){
  const response = await fetch('/api/extract-phone', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: base64Image })
  });
  if (!response.ok) throw new Error('api-failed');
  const data = await response.json();
  return { phone: data.phone || null, alternates: data.alternates || [] };
}

function setStatus(msg, isError=false){
  els.statusText.hidden = !msg;
  els.statusText.textContent = msg;
  els.statusText.classList.toggle('error', isError);
}

function renderAlternates(list){
  els.altChips.innerHTML = '';
  els.altWrap.hidden = list.length === 0;
  list.forEach(num => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = num;
    chip.addEventListener('click', () => { els.phoneInput.value = num; });
    els.altChips.appendChild(chip);
  });
}

function openResult(phone, alternates = []){
  els.resultCard.hidden = false;
  els.phoneInput.value = phone || '';
  els.resultHint.textContent = phone
    ? 'لو الرقم غلط أو ناقص، عدّله يدويًا قبل الحفظ'
    : 'مالقتش رقم في الصورة — اكتبه يدويًا';
  renderAlternates(alternates);
  els.phoneInput.classList.remove('revealed');
  requestAnimationFrame(() => {
    void els.phoneInput.offsetWidth;
    els.phoneInput.classList.add('revealed');
  });
  els.resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

els.cameraBtn.addEventListener('click', () => els.fileInputCamera.click());
els.galleryBtn.addEventListener('click', () => els.fileInputGallery.click());

els.fileInputCamera.addEventListener('change', () => handleFile(els.fileInputCamera));
els.fileInputGallery.addEventListener('change', () => handleFile(els.fileInputGallery));

async function handleFile(inputEl){
  const file = inputEl.files[0];
  if (!file) return;

  els.resultCard.hidden = true;
  els.previewWrap.hidden = false;
  els.previewImg.src = URL.createObjectURL(file);
  setStatus('');

  try{
    setStatus('بيقرا الريسيت...');
    els.statusText.insertAdjacentHTML('beforeend', '<span class="spinner"></span>');
    const base64 = await resizeImageToBase64(file);
    const { phone, alternates } = await extractPhone(base64);
    setStatus('');
    openResult(phone, alternates);
  }catch(err){
    setStatus('حصلت مشكلة في القراءة — جرّب تاني، أو اكتب الرقم يدويًا', true);
    openResult('', []);
  }finally{
    inputEl.value = '';
  }
}

els.saveBtn.addEventListener('click', async () => {
  const phone = els.phoneInput.value.trim();
  if (!phone){
    showToast('اكتب الرقم الأول');
    return;
  }
  log.unshift({ phone, savedAt: new Date().toISOString() });
  await saveLog();
  renderLog();
  els.resultCard.hidden = true;
  els.previewWrap.hidden = true;
  showToast('اتحفظ ✅');
});

els.discardBtn.addEventListener('click', () => {
  els.resultCard.hidden = true;
  els.previewWrap.hidden = true;
});

els.copyAllBtn.addEventListener('click', async () => {
  const text = log.map(e => e.phone).join('\n');
  await navigator.clipboard.writeText(text);
  showToast('اتنسخت كل الأرقام ✅');
});

els.csvBtn.addEventListener('click', () => {
  const rows = ['الرقم,التاريخ', ...log.map(e => `${e.phone},${formatTime(e.savedAt)}`)];
  const blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `phone-log-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
});

els.clearBtn.addEventListener('click', async () => {
  if (!confirm('تمسح كل الأرقام المحفوظة؟ الخطوة دي مش هترجع')) return;
  log = [];
  await saveLog();
  renderLog();
  showToast('اتمسح الكل');
});

// ---------- init ----------
(async () => {
  log = await loadLog();
  renderLog();
})();
</script>
</body>
</html>
