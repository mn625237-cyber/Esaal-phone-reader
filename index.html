<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>مساعد الذكاء الاصطناعي</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #dc2626;
      --radius: 20px;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 560px;
    }

    header {
      text-align: center;
      margin: 24px 0 20px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    .drop-zone {
      border: 2px dashed #c7c9d1;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      background: #fafafa;
    }

    .drop-zone:active,
    .drop-zone.dragover {
      border-color: var(--primary);
      background: #eef2ff;
    }

    .drop-zone .icon {
      font-size: 2rem;
    }

    .drop-zone p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.9rem;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      margin: 12px auto 0;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      margin-top: 12px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      background: var(--primary);
      color: #fff;
      margin-top: 16px;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.5);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-top: 12px;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .result-box {
      margin-top: 16px;
      padding: 16px;
      background: #f8fafc;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .result-box h3 {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .result-box pre,
    .history-item pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      direction: ltr;
      text-align: left;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .history-header h2 {
      font-size: 1.1rem;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.85rem;
    }

    .history-item .meta {
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 6px;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 20px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 10px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧠 مساعد الذكاء الاصطناعي</h1>
      <p>ارفع صورة أو أدخل نصًا وسيتولى الذكاء الاصطناعي المهمة</p>
    </header>

    <main class="card">
      <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="رفع صورة">
        <div class="icon">📷</div>
        <p>اضغط لاختيار صورة أو التقط صورة بالكاميرا</p>
        <input type="file" id="fileInput" accept="image/*" capture="environment" hidden />
      </div>
      <img id="preview" alt="معاينة الصورة" />

      <textarea id="textInput" placeholder="أو ألصق النص هنا..."></textarea>

      <button id="submitBtn" class="btn">
        <span id="btnText">معالجة</span>
      </button>

      <div id="message" class="message" role="alert"></div>

      <div id="resultBox" class="result-box" style="display: none;">
        <h3>النتيجة</h3>
        <pre id="resultContent"></pre>
      </div>
    </main>

    <section class="card">
      <div class="history-header">
        <h2>السجل</h2>
        <button id="clearHistoryBtn" class="clear-btn">مسح السجل</button>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </section>

    <footer>تعمل هذه الأداة عبر Vercel Serverless + OpenAI</footer>
  </div>

  <script>
    (function () {
      const HISTORY_KEY = 'ai_history';
      const MAX_HISTORY = 20;

      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const preview = document.getElementById('preview');
      const textInput = document.getElementById('textInput');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const messageEl = document.getElementById('message');
      const resultBox = document.getElementById('resultBox');
      const resultContent = document.getElementById('resultContent');
      const historyList = document.getElementById('historyList');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');

      let currentImageDataUrl = null;
      let currentInputType = null;

      function showError(msg) {
        messageEl.textContent = msg;
        messageEl.className = 'message error';
      }

      function clearError() {
        messageEl.textContent = '';
        messageEl.className = 'message';
      }

      function setLoading(loading) {
        submitBtn.disabled = loading;
        btnText.textContent = loading ? 'جارٍ المعالجة...' : 'معالجة';

        if (loading) {
          const spinner = document.createElement('span');
          spinner.className = 'spinner';
          spinner.id = 'btnSpinner';
          submitBtn.insertBefore(spinner, btnText);
        } else {
          const existingSpinner = document.getElementById('btnSpinner');
          if (existingSpinner) existingSpinner.remove();
        }
      }

      function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function resizeImage(file, maxDim = 1024, quality = 0.8) {
        return new Promise((resolve, reject) => {
          const objectUrl = URL.createObjectURL(file);
          const img = new Image();

          img.onload = () => {
            try {
              let { width, height } = img;

              if (width > height && width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }

              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;

              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              URL.revokeObjectURL(objectUrl);
              resolve(canvas.toDataURL('image/jpeg', quality));
            } catch (err) {
              URL.revokeObjectURL(objectUrl);
              reject(err);
            }
          };

          img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error('فشل تحميل الصورة'));
          };

          img.src = objectUrl;
        });
      }

      async function handleFile(file) {
        clearError();

        if (!file) return;

        if (!file.type.startsWith('image/')) {
          showError('الرجاء اختيار ملف صورة صالح.');
          return;
        }

        try {
          setLoading(true);

          const dataUrl = await resizeImage(file);

          currentImageDataUrl = dataUrl;
          currentInputType = 'image';

          preview.src = dataUrl;
          preview.style.display = 'block';
        } catch (err) {
          showError('تعذر معالجة الصورة. حاول صورة أخرى.');
        } finally {
          setLoading(false);
        }
      }

      function loadHistory() {
        try {
          return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
        } catch {
          return [];
        }
      }

      function saveHistoryItem(result) {
        const history = loadHistory();

        history.unshift({
          id: Date.now(),
          timestamp: Date.now(),
          result,
          inputType: currentInputType || 'text',
        });

        localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, MAX_HISTORY)));
        renderHistory();
      }

      function renderHistory() {
        const history = loadHistory();

        if (history.length === 0) {
          historyList.innerHTML = '<li class="empty">لا يوجد سجل بعد.</li>';
          return;
        }

        historyList.innerHTML = history
          .map((item) => {
            const date = new Date(item.timestamp).toLocaleString('ar');
            const typeLabel =
              item.inputType === 'image'
                ? '📷 صورة'
                : item.inputType === 'mixed'
                ? '📷 + 📝 صورة ونص'
                : '📝 نص';

            return `
              <li class="history-item">
                <div class="meta">${date} • ${typeLabel}</div>
                <pre>${escapeHTML(item.result)}</pre>
              </li>
            `;
          })
          .join('');
      }

      function clearHistory() {
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
      }

      function displayResult(text) {
        let formatted = text;

        try {
          const parsed = JSON.parse(text);
          formatted = JSON.stringify(parsed, null, 2);
        } catch {
          // النص ليس JSON، نعرضه كما هو.
        }

        resultContent.textContent = formatted;
        resultBox.style.display = 'block';
      }

      async function handleSubmit() {
        clearError();

        const text = textInput.value.trim();

        if (!currentImageDataUrl && !text) {
          showError('الرجاء إدخال نص أو رفع صورة أولاً.');
          return;
        }

        if (currentImageDataUrl && text) {
          currentInputType = 'mixed';
        } else if (currentImageDataUrl) {
          currentInputType = 'image';
        } else {
          currentInputType = 'text';
        }

        setLoading(true);

        try {
          const response = await fetch('/api/process', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              image: currentImageDataUrl,
              text: text || '',
            }),
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.error || 'حدث خطأ غير متوقع.');
          }

          const result = data.result || 'لا توجد نتيجة.';
          displayResult(result);
          saveHistoryItem(result);
        } catch (err) {
          showError(err.message || 'تعذر الاتصال بالخادم.');
        } finally {
          setLoading(false);
        }
      }

      dropZone.addEventListener('click', () => fileInput.click());

      dropZone.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          fileInput.click();
        }
      });

      fileInput.addEventListener('change', (e) => {
        handleFile(e.target.files[0]);
        e.target.value = '';
      });

      ['dragenter', 'dragover'].forEach((evt) => {
        dropZone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropZone.classList.add('dragover');
        });
      });

      ['dragleave', 'drop'].forEach((evt) => {
        dropZone.addEventListener(evt, (e) => {
          e.preventDefault();
          dropZone.classList.remove('dragover');
        });
      });

      dropZone.addEventListener('drop', (e) => {
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
      });

      submitBtn.addEventListener('click', handleSubmit);

      clearHistoryBtn.addEventListener('click', () => {
        if (confirm('هل تريد مسح السجل بالكامل؟')) {
          clearHistory();
        }
      });

      renderHistory();
    })();
  </script>
</body>
</html>
