<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استخراج رقم العميل من الإيصال</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin:0;
    font-family:
    "Tahoma",
    "Arial",
    sans-serif;

    background:#f4efe7;

    color:#222;

}


.container {

    width:100%;
    max-width:480px;

    margin:auto;

    padding:20px;

}


.header {

    background:#fff;

    border-radius:18px;

    padding:20px;

    text-align:center;

    box-shadow:
    0 5px 20px rgba(0,0,0,.08);

    margin-bottom:20px;

}


.header h1 {

    margin:0 0 10px;

    font-size:24px;

}


.header p {

    margin:0;

    color:#666;

    font-size:14px;

}



/* Receipt Paper */

.receipt-box {

    background:#fff;

    border-radius:15px;

    padding:15px;

    box-shadow:
    0 4px 15px rgba(0,0,0,.1);

    border:
    1px dashed #bbb;

}



.upload-buttons {

    display:flex;

    flex-direction:column;

    gap:12px;

    margin-bottom:15px;

}


.upload-btn {

    display:block;

    background:#222;

    color:white;

    padding:15px;

    text-align:center;

    border-radius:12px;

    cursor:pointer;

    font-size:16px;

}


.upload-btn.secondary {

    background:#555;

}



input[type=file] {

    display:none;

}




.preview-container {

    margin-top:15px;

    text-align:center;

}


#preview {

    width:100%;

    max-height:420px;

    object-fit:contain;

    border-radius:12px;

    cursor:pointer;

    transition:.3s;

    background:#eee;

}



#preview.zoomed {

    position:fixed;

    top:10px;

    left:10px;

    width:calc(100% - 20px);

    height:calc(100% - 20px);

    max-height:none;

    z-index:1000;

    background:white;

    object-fit:contain;

    padding:10px;

    box-shadow:
    0 0 30px rgba(0,0,0,.5);

}





.action-btn {

    width:100%;

    border:none;

    padding:14px;

    border-radius:12px;

    margin-top:12px;

    font-size:17px;

    cursor:pointer;

}



#processBtn {

    background:#0b7cff;

    color:white;

}



#processBtn:disabled {

    opacity:.5;

}



.result {

    margin-top:20px;

    background:#fff;

    border-radius:15px;

    padding:15px;

    text-align:center;

    display:none;

}



.phone {

    font-size:28px;

    font-weight:bold;

    direction:ltr;

    display:block;

    margin:10px;

}



.copy {

    background:#16a34a;

    color:white;

}



.call {

    background:#f59e0b;

    color:white;

}




.loading {

    display:none;

    text-align:center;

    padding:20px;

}



.spinner {

    width:35px;

    height:35px;

    border:4px solid #ddd;

    border-top-color:#0b7cff;

    border-radius:50%;

    margin:auto;

    animation:spin 1s linear infinite;

}


@keyframes spin {

    to {
        transform:rotate(360deg);
    }

}



.error {

    background:#fee2e2;

    color:#991b1b;

    padding:12px;

    border-radius:10px;

    margin-top:15px;

    display:none;

}



.history {

    margin-top:20px;

}


.history h2 {

    font-size:18px;

}



.history-item {

    background:white;

    padding:12px;

    border-radius:10px;

    margin-bottom:8px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    direction:ltr;

}


.clear {

    background:#dc2626;

    color:white;

}



</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>📱 استخراج رقم العميل</h1>

<p>
ارفع صورة إيصال المطعم وسيتم استخراج رقم الموبايل المصري تلقائياً
</p>

</div>



<div class="receipt-box">


<div class="upload-buttons">


<label class="upload-btn">

📷 التقاط صورة

<input 
id="cameraInput"
type="file"
accept="image/*"
capture="environment">

</label>



<label class="upload-btn secondary">

🖼️ اختيار من المعرض

<input 
id="galleryInput"
type="file"
accept="image/*">

</label>


</div>



<div class="preview-container">

<img id="preview" style="display:none">


</div>



<button 
id="processBtn"
class="action-btn"
disabled>

🔍 استخراج الرقم

</button>



<div class="loading" id="loading">

<div class="spinner"></div>

<p>جاري تحليل الإيصال...</p>

</div>



<div class="error" id="errorBox"></div>



</div>
<div class="result" id="resultBox">

<h2>✅ الرقم المستخرج</h2>

<span class="phone" id="phoneNumber"></span>

<button 
class="action-btn copy"
id="copyBtn">

📋 نسخ الرقم

</button>


<a 
id="callBtn"
class="action-btn call"
style="display:block;text-decoration:none">

📞 اتصال

</a>


</div>



<div class="history">

<h2>📜 السجل السابق</h2>

<div id="historyList"></div>


<button 
class="action-btn clear"
id="clearHistory">

🗑️ مسح السجل

</button>


</div>



</div>


<script>


const cameraInput =
document.getElementById("cameraInput");


const galleryInput =
document.getElementById("galleryInput");


const preview =
document.getElementById("preview");


const processBtn =
document.getElementById("processBtn");


const loading =
document.getElementById("loading");


const errorBox =
document.getElementById("errorBox");


const resultBox =
document.getElementById("resultBox");


const phoneNumber =
document.getElementById("phoneNumber");


const callBtn =
document.getElementById("callBtn");


const copyBtn =
document.getElementById("copyBtn");


const historyList =
document.getElementById("historyList");


const clearHistory =
document.getElementById("clearHistory");



let selectedFile = null;

let compressedBase64 = null;

let selectedMime =
"image/jpeg";





// استقبال الصورة من الكاميرا أو المعرض

cameraInput.addEventListener(
"change",
handleImage
);


galleryInput.addEventListener(
"change",
handleImage
);



async function handleImage(e){


const file =
e.target.files[0];


if(!file)
return;



selectedFile = file;


try{


const optimized =
await compressImage(file);



compressedBase64 =
optimized.base64;


selectedMime =
optimized.mimeType;



preview.src =
"data:image/jpeg;base64,"+
compressedBase64;


preview.style.display =
"block";


processBtn.disabled =
false;


hideError();


}

catch(err){

showError(
"حدث خطأ أثناء تجهيز الصورة"
);

}



}





// ضغط الصورة قبل الإرسال

function compressImage(file){


return new Promise(
(resolve,reject)=>{


const reader =
new FileReader();


reader.onload =
function(){

const img =
new Image();


img.onload =
function(){


const canvas =
document.createElement(
"canvas"
);


const maxWidth =
1200;


let width =
img.width;


let height =
img.height;



if(width > maxWidth){

height =
Math.round(
height *
(maxWidth / width)
);

width =
maxWidth;

}



canvas.width =
width;

canvas.height =
height;



const ctx =
canvas.getContext(
"2d"
);


ctx.drawImage(
img,
0,
0,
width,
height
);



const data =
canvas.toDataURL(
"image/jpeg",
0.75
);



resolve({

base64:
data.split(",")[1],

mimeType:
"image/jpeg"

});


};



img.onerror =
reject;


img.src =
reader.result;


};



reader.onerror =
reject;


reader.readAsDataURL(file);



});

}





// تكبير الصورة

preview.addEventListener(
"click",
()=>{

preview.classList.toggle(
"zoomed"
);

});






// إرسال الصورة إلى Vercel API

processBtn.addEventListener(
"click",
async()=>{


if(!compressedBase64)
return;



processBtn.disabled =
true;


loading.style.display =
"block";


resultBox.style.display =
"none";


hideError();



try{


const response =
await fetch(
"/api/process",
{

method:"POST",

headers:
{
"Content-Type":
"application/json"
},


body:
JSON.stringify({

imageBase64:
compressedBase64,


mimeType:
selectedMime


})


});


const data =
await response.json();



if(!response.ok){

throw new Error(
data.error ||
"حدث خطأ"
);

}



displayResult(
data.phone
);



}

catch(err){

showError(
err.message
||
"فشل الاتصال بالخادم"
);


}

finally{


loading.style.display =
"none";


processBtn.disabled =
false;


}



});








function displayResult(phone){


if(phone){


phoneNumber.textContent =
phone;


callBtn.href =
"tel:"+phone;


resultBox.style.display =
"block";


saveHistory(phone);



}

else{


phoneNumber.textContent =
"لم يتم العثور على رقم";


callBtn.style.display =
"none";


resultBox.style.display =
"block";

}



}




// نسخ الرقم

copyBtn.addEventListener(
"click",
async()=>{


const phone =
phoneNumber.textContent;


if(
phone.startsWith("01")
){

await navigator.clipboard.writeText(
phone
);


copyBtn.textContent =
"✅ تم النسخ";


setTimeout(
()=>{

copyBtn.textContent =
"📋 نسخ الرقم";

},
2000
);


}



});







// Local Storage History


function saveHistory(phone){


let history =
JSON.parse(
localStorage.getItem(
"receiptHistory"
)
||
"[]"
);



history.unshift({

phone,

date:
new Date().toLocaleString(
"ar-EG"
)

});



history =
history.slice(
0,
20
);



localStorage.setItem(
"receiptHistory",
JSON.stringify(history)
);



renderHistory();


}





function renderHistory(){


let history =
JSON.parse(
localStorage.getItem(
"receiptHistory"
)
||
"[]"
);



historyList.innerHTML =
"";



history.forEach(
(item)=>{


const div =
document.createElement(
"div"
);


div.className =
"history-item";


div.innerHTML =

`
<span>
${item.phone}
<br>
<small>${item.date}</small>
</span>

<a href="tel:${item.phone}">
📞
</a>

`;



historyList.appendChild(div);



});


}




clearHistory.addEventListener(
"click",
()=>{


localStorage.removeItem(
"receiptHistory"
);


renderHistory();


});






function showError(msg){


errorBox.textContent =
msg;


errorBox.style.display =
"block";


}



function hideError(){


errorBox.style.display =
"none";

}



renderHistory();


</script>


</body>

</html>
